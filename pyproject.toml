[project]
name = "blog"
version = "0.1.0"
description = "A personal blog with article-level permission control"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "markdown>=3.5",
    "pygments>=2.17",
    "itsdangerous>=2.1",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["httpx", "pytest"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["static*", "content*", "venv*"]
