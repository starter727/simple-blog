{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-bold text-lg">B</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">欢迎回来</h1>
            <p class="text-gray-500 text-sm mt-1">登录你的账户</p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-600 px-4 py-3 rounded-xl mb-6 text-sm border border-red-100">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/auth/login">
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                <input type="text" name="username" required
                       class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                       placeholder="输入用户名">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                <input type="password" name="password" required
                       class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                       placeholder="输入密码">
            </div>
            <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-xl hover:from-blue-700 hover:to-purple-700 transition-all font-medium shadow-lg shadow-blue-500/25">
                登录
            </button>
        </form>
    </div>
</div>
{% endblock %}
