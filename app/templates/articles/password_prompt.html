{% extends "base.html" %}
{% block title %}需要密码{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
        <div class="w-16 h-16 bg-amber-50 rounded-2xl flex items-center justify-center mx-auto mb-6">
            <span class="text-3xl">🔒</span>
        </div>
        <h1 class="text-xl font-bold text-gray-900 mb-2">{{ article.title }}</h1>
        <p class="text-gray-500 text-sm mb-8">此文章需要密码才能查看</p>

        {% if error %}
        <div class="bg-red-50 text-red-600 px-4 py-3 rounded-xl mb-6 text-sm border border-red-100">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/article/{{ article.slug }}/unlock">
            <input type="password" name="password" placeholder="请输入密码" required
                   class="w-full border border-gray-200 rounded-xl px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
            <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-xl hover:from-blue-700 hover:to-purple-700 transition-all font-medium shadow-lg shadow-blue-500/25">
                验证密码
            </button>
        </form>

        <a href="/" class="inline-block mt-6 text-sm text-gray-400 hover:text-gray-600 transition-colors">
            ← 返回首页
        </a>
    </div>
</div>
{% endblock %}
